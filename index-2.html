<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Class Log">
<meta name="theme-color" content="#f4f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<title>Classroom Log</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f4; --surface: #ffffff; --surface-2: #eef1ee; --ink: #15201b; --muted: #5f6d66;
  --line: #dfe4e0; --accent: #14614d; --accent-ink: #ffffff; --accent-soft: #e2f1eb;
  --warn: #b42318; --warn-soft: #fdecea; --amber: #8a5a00; --amber-soft: #fff3d1;
  --shadow: 0 1px 2px rgba(16,24,20,.06), 0 8px 24px rgba(16,24,20,.06);
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1412; --surface: #181f1c; --surface-2: #222b27; --ink: #e9efec; --muted: #94a29c;
    --line: #2c3632; --accent: #45b890; --accent-ink: #06140f; --accent-soft: #1b3229;
    --warn: #ff8a7a; --warn-soft: #3a1d1a; --amber: #f0c66b; --amber-soft: #3a2f14;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100dvh; touch-action: manipulation; overscroll-behavior: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; white-space: nowrap; user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 14px; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* ---------- Top bar ---------- */
.top {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand .t { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand .s { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button {
  border: 0; background: transparent; min-height: 44px; padding: 0 26px; border-radius: 10px;
  font-weight: 700; font-size: 16px; color: var(--muted);
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.top-r { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
.clock { text-align: right; line-height: 1.15; }
.clock b { display: block; font-size: 18px; }
.clock span { color: var(--muted); font-size: 13px; }
.lock svg { width: 18px; height: 18px; }

.banner { display: none; padding: 10px 20px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; }
.banner.show { display: block; }

/* ---------- Period row ---------- */
.periods { display: flex; align-items: center; gap: 8px; padding: 14px 20px 0; flex-wrap: wrap; }
.periods .lbl { color: var(--muted); font-size: 14px; font-weight: 600; margin-right: 4px; }
.chip {
  min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .now { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.chip.on .now { background: currentColor; }
.periods .note { color: var(--muted); font-size: 14px; margin-left: 6px; }

/* ---------- Main layout ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 16px 20px 28px; align-items: start; }
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .side { order: -1; }
  .top { grid-template-columns: 1fr auto; }
  .top .seg { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  .top .seg button { flex: 1; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.card .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.count { background: var(--surface-2); color: var(--muted); border-radius: 999px; font-size: 13px; padding: 2px 10px; font-weight: 700; }
.pick h2 { font-size: 24px; }

.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 16px; }
.name {
  min-height: 68px; padding: 10px 14px; text-align: left; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); display: flex; flex-direction: column; justify-content: center; gap: 2px;
  font-weight: 650; font-size: 17px; line-height: 1.2; user-select: none; -webkit-user-select: none;
}
.name:active { background: var(--surface-2); }
.name small { font-weight: 600; font-size: 13px; color: var(--muted); }
.name.out { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.name.out small { color: var(--accent); }
.name.wait { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
.name.wait small { color: var(--amber); }
.name.done { color: var(--muted); background: var(--surface-2); }
.name.other { border-style: dashed; color: var(--muted); background: transparent; }
.empty { color: var(--muted); padding: 22px 4px 6px; }
.empty b { color: var(--ink); display: block; font-size: 17px; margin-bottom: 4px; }

/* ---------- Side cards ---------- */
.pass { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
.pass.over { border-color: var(--warn); background: var(--warn-soft); }
.pass .who { font-weight: 700; font-size: 18px; }
.pass .meta { color: var(--muted); font-size: 13px; }
.pass .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.timer { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pass.over .timer { color: var(--warn); }
.free { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.free i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.qrow, .lrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.qrow:first-of-type, .lrow:first-of-type { border-top: 0; }
.qrow .pos { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.qrow .who, .lrow .who { font-weight: 650; flex: 1; min-width: 0; }
.qrow .who small, .lrow .who small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.lrow .late { font-weight: 700; color: var(--amber); font-size: 14px; white-space: nowrap; }
.list { margin-top: 10px; }

/* ---------- Sheets ---------- */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,11,.5); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.show { display: flex; }
.sheet { background: var(--surface); border-radius: 22px; padding: 26px; width: min(460px, 100%); max-height: calc(100dvh - 40px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet h3 { font-size: 22px; letter-spacing: -.01em; }
.sheet p { color: var(--muted); margin-top: 6px; }
.sheet .acts { display: grid; gap: 10px; margin-top: 20px; }
.sheet .big-name { font-size: 28px; font-weight: 750; letter-spacing: -.02em; margin-bottom: 4px; }
.field { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .inp {
  display: block; width: 100%; margin-top: 6px; min-height: 48px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 16px; font-weight: 500;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--warn); font-weight: 600; font-size: 14px; margin-top: 12px; min-height: 20px; }

/* PIN pad */
.dots { display: flex; gap: 14px; justify-content: center; margin: 20px 0 6px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.f { background: var(--ink); border-color: var(--ink); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.keys button { min-height: 64px; font-size: 24px; font-weight: 600; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.keys button.x { background: transparent; border-color: transparent; font-size: 15px; color: var(--muted); }

/* ---------- Signature ---------- */
.sign { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column;
  padding: calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom)); }
.sign.show { display: flex; }
.sign-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sign-top .k { color: var(--muted); font-weight: 600; }
.sign-top .n { font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
.padwrap { position: relative; flex: 1; min-height: 0; margin: 16px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.padwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.padwrap .base { position: absolute; left: 6%; right: 6%; bottom: 26%; border-bottom: 2px solid var(--line); pointer-events: none; }
.padwrap .hint { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; color: var(--muted); pointer-events: none; font-size: 17px; }
.sign-acts { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
svg.sig { display: block; width: 100%; height: 100%; color: var(--ink); }
.sigcell { width: 120px; height: 40px; }
.sigcell img { max-width: 100%; max-height: 100%; display: block; border-radius: 4px; }

/* ---------- Teacher ---------- */
.teacher { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.teacher.show { display: flex; }
.t-top { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.t-top h1 { font-size: 18px; flex: none; }
.t-tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.t-tabs::-webkit-scrollbar { display: none; }
.t-tabs button { border: 0; background: transparent; min-height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 650; color: var(--muted); white-space: nowrap; }
.t-tabs button.on { background: var(--surface-2); color: var(--ink); }
.t-body { flex: 1; overflow: auto; padding: 20px; }
.t-body > .card { max-width: 1100px; margin-left: auto; margin-right: auto; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.bar .sp { flex: 1; }
.bar .inp { width: auto; margin: 0; }
.tw { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
th[data-act] { cursor: pointer; }
th.sorted { color: var(--ink); }
td.r, th.r { text-align: right; }
td .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }
td .tag.out { background: var(--accent-soft); color: var(--accent); }
.set { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.set:first-of-type { border-top: 0; }
.set .tx { flex: 1; }
.set .tx b { display: block; }
.set .tx span { color: var(--muted); font-size: 14px; }
.sw { position: relative; width: 54px; height: 32px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); pointer-events: none; transition: background .15s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.sw input:checked + i { background: var(--accent); border-color: var(--accent); }
.sw input:checked + i::after { left: 25px; }
.prow { display: grid; grid-template-columns: 90px 1fr 1fr auto; gap: 10px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.prow:first-of-type { border-top: 0; }
.prow .pl { font-weight: 700; font-size: 17px; padding-bottom: 12px; }
.prow .field { margin: 0; }
textarea.roster { min-height: 340px; line-height: 1.6; resize: vertical; }
.steps { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
.steps li { margin-top: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 999px; font-weight: 650; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast, .sw i, .sw i::after { transition: none; } .btn:active { transform: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="t" id="title"></div><div class="s" id="subtitle"></div></div>
  <div class="seg" id="tabs" role="tablist">
    <button type="button" data-act="tab" data-v="bath" role="tab">Bathroom</button>
    <button type="button" data-act="tab" data-v="late" role="tab">Late</button>
  </div>
  <div class="top-r">
    <div class="clock"><b class="num" id="clockT"></b><span id="clockD"></span></div>
    <button class="btn lock" type="button" data-act="teacher" aria-label="Teacher area">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Teacher
    </button>
  </div>
</header>
<div class="banner" id="banner" role="alert"></div>
<div class="periods" id="periods"></div>
<main class="main">
  <section class="card pick" id="pick"></section>
  <aside class="side" id="side"></aside>
</main>

<div class="teacher" id="teacher">
  <div class="t-top">
    <h1>Teacher</h1>
    <div class="t-tabs" id="tTabs"></div>
    <button class="btn primary" type="button" data-act="lockTeacher">Lock &amp; close</button>
  </div>
  <div class="t-body" id="tBody"></div>
</div>

<div class="modal" id="modal"></div>

<div class="sign" id="sign" role="dialog" aria-modal="true" aria-label="Sign your name">
  <div class="sign-top">
    <div><div class="k" id="signK"></div><div class="n" id="signN"></div></div>
    <button class="btn" type="button" id="signCancel">Cancel</button>
  </div>
  <div class="padwrap">
    <div class="base"></div>
    <div class="hint" id="signHint">Sign here with your finger or the Pencil</div>
    <canvas id="pad"></canvas>
  </div>
  <div class="sign-acts">
    <button class="btn big" type="button" id="signClear">Clear</button>
    <button class="btn big primary" type="button" id="signDone" disabled>Done</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";

/* ============================ Helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftKey = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtDay = k => parseKey(k).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
const fmtShort = k => parseKey(k).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
const hhmm = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const tsAt = (key, hm) => { const d = parseKey(key); const [h, m] = hm.split(":").map(Number); d.setHours(h, m, 0, 0); return d.getTime(); };
const uid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
const mins = ms => Math.max(0, Math.round(ms / 60000));
const elapsed = ms => { const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}:${pad2(m % 60)}:${pad2(s % 60)}` : `${m}:${pad2(s % 60)}`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ============================ Storage ============================ */
/* Everything lives in this browser's IndexedDB on this device. Nothing is sent anywhere. */
const DB = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open("classroom-log", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("meta"); r.result.createObjectStore("events", { keyPath: "id" }); };
        r.onsuccess = () => { this.db = r.result; this.ok = true; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  run(store, mode, fn) {
    if (!this.ok) return Promise.resolve(undefined);
    return new Promise(res => {
      let out;
      try {
        const tx = this.db.transaction(store, mode);
        const rq = fn(tx.objectStore(store));
        if (rq) rq.onsuccess = () => { out = rq.result; };
        tx.oncomplete = () => res(out);
        tx.onerror = tx.onabort = () => { saveFailed(); res(undefined); };
      } catch (e) { saveFailed(); res(undefined); }
    });
  },
  getMeta(k) { return this.run("meta", "readonly", s => s.get(k)); },
  setMeta(k, v) { return this.run("meta", "readwrite", s => { s.put(v, k); }); },
  delMeta(k) { return this.run("meta", "readwrite", s => { s.delete(k); }); },
  all() { return this.run("events", "readonly", s => s.getAll()); },
  put(e) { return this.run("events", "readwrite", s => { s.put(e); }); },
  putMany(list) { return this.run("events", "readwrite", s => { list.forEach(e => s.put(e)); }); },
  del(id) { return this.run("events", "readwrite", s => { s.delete(id); }); },
  delMany(ids) { return this.run("events", "readwrite", s => { ids.forEach(id => s.delete(id)); }); },
  clear() { return this.run("events", "readwrite", s => { s.clear(); }); }
};
function saveFailed() { banner("Saving failed on this device. Open Teacher → Backup and download a backup now."); }
function banner(msg) { const b = $("#banner"); b.textContent = msg; b.classList.toggle("show", !!msg); }

/* ============================ State ============================ */
const DEFAULTS = {
  title: "Classroom Log", subtitle: "Abraham Lincoln HS · Mr. Mehanovic",
  oneOut: true, queue: true, sign: true, overMin: 15,
  periods: ["2", "3", "6", "7", "8"].map(id => ({ id, start: "", end: "" }))
};
const S = { settings: JSON.parse(JSON.stringify(DEFAULTS)), roster: {}, events: [], queue: { date: todayKey(), items: [] }, pin: null, lastBackup: null };

/* Passes nobody marked back: close them at the period's end so the pass frees up. */
function autoClose() {
  const now = Date.now(), tk = todayKey(); let changed = false;
  S.events.forEach(e => {
    if (e.type !== "pass" || e.inAt) return;
    const p = period(e.period);
    let end = p && p.end ? tsAt(e.date, p.end) : null;
    if (e.date < tk) end = end && end > e.outAt ? end : e.outAt;
    else if (!(end && end > e.outAt && now >= end)) return;
    e.inAt = end; e.auto = true; DB.put(e); changed = true;
  });
  return changed;
}

function hashPin(pin, salt) { let h = 2166136261; const s = salt + ":" + pin; for (let r = 0; r < 2000; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r; h = Math.imul(h, 16777619) >>> 0; } return h.toString(16); }

async function createPin() {

/* ============================ Signatures ============================ */
/* Stored as pen strokes (a few KB), not images, so a full year of logs stays small. */
function strokePath(pts) {
  if (pts.length <= 2) return `M${pts[0]} ${pts[1]}l0.01 0`;
  let d = `M${pts[0]} ${pts[1]}`;
  for (let i = 2; i < pts.length - 2; i += 2) d += `Q${pts[i]} ${pts[i + 1]} ${(pts[i] + pts[i + 2]) / 2} ${(pts[i + 1] + pts[i + 3]) / 2}`;
  return d + `L${pts[pts.length - 2]} ${pts[pts.length - 1]}`;
}
function sigHTML(e) {
  if (e.sig) return `<div class="sigcell"><svg class="sig" viewBox="0 0 ${e.sig.w} ${e.sig.h}" preserveAspectRatio="xMinYMid meet" aria-label="Signature"><path d="${e.sig.s.map(strokePath).join("")}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>`;
  if (e.img) return `<div class="sigcell"><img src="${esc(e.img)}" alt="Signature"></div>`;
  return `<span style="color:var(--muted)">—</span>`;
}
function drawStrokes(ctx, strokes, k, ox, oy, width, color) {
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = color; ctx.lineWidth = width;
  strokes.forEach(p => {
    ctx.beginPath(); ctx.moveTo(ox + p[0] * k, oy + p[1] * k);
    if (p.length <= 2) ctx.lineTo(ox + p[0] * k + 0.01, oy + p[1] * k);
    for (let i = 2; i < p.length - 2; i += 2) ctx.quadraticCurveTo(ox + p[i] * k, oy + p[i + 1] * k, ox + (p[i] + p[i + 2]) / 2 * k, oy + (p[i + 1] + p[i + 3]) / 2 * k);
    if (p.length > 2) ctx.lineTo(ox + p[p.length - 2] * k, oy + p[p.length - 1] * k);
    ctx.stroke();
  });
}

const padEl = $("#pad"), padCtx = padEl.getContext("2d");
const Sign = { open: false, strokes: [], cur: null, pid: null, pen: false, done: null };
function sizePad() {
  const r = padEl.getBoundingClientRect(); if (r.width < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  padEl.width = Math.round(r.width * dpr); padEl.height = Math.round(r.height * dpr);
  padCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawStrokes(padCtx, Sign.strokes, 1, 0, 0, 3, getComputedStyle(document.body).color);
}
function padInk() { const has = Sign.strokes.length > 0; $("#signDone").disabled = !has; $("#signHint").style.display = has ? "none" : ""; }
function getSignature(name, label) {
  return new Promise(res => {
    Sign.strokes = []; Sign.cur = null; Sign.pid = null; Sign.pen = false; Sign.open = true;
    Sign.done = v => { Sign.open = false; Sign.done = null; $("#sign").classList.remove("show"); res(v); };
    $("#signK").textContent = label; $("#signN").textContent = name;
    $("#sign").classList.add("show"); padInk();
    requestAnimationFrame(sizePad);
  });
}
function finishSignature() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  Sign.strokes.forEach(p => { for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); } });
  const P = 6;
  return { w: Math.round(x1 - x0 + 2 * P), h: Math.round(y1 - y0 + 2 * P), s: Sign.strokes.map(p => p.map((v, i) => Math.round((v - (i % 2 ? y0 : x0) + P) * 10) / 10)) };
}
const padPt = e => { const r = padEl.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
padEl.addEventListener("pointerdown", e => {
  if (!Sign.open || Sign.pid !== null) return;
  if (e.pointerType === "pen") Sign.pen = true; else if (Sign.pen && e.pointerType === "touch") return; /* ignore a resting palm */
  e.preventDefault(); try { padEl.setPointerCapture(e.pointerId); } catch (x) {}
  Sign.pid = e.pointerId; Sign.cur = padPt(e); Sign.strokes.push(Sign.cur); padInk();
  padCtx.lineCap = "round"; padCtx.lineJoin = "round"; padCtx.lineWidth = 3; padCtx.strokeStyle = getComputedStyle(document.body).color;
  padCtx.beginPath(); padCtx.moveTo(Sign.cur[0], Sign.cur[1]); padCtx.lineTo(Sign.cur[0] + 0.01, Sign.cur[1]); padCtx.stroke();
});
padEl.addEventListener("pointermove", e => {
  if (e.pointerId !== Sign.pid || !Sign.cur) return;
  e.preventDefault();
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  (list.length ? list : [e]).forEach(ev => {
    const [x, y] = padPt(ev), c = Sign.cur, n = c.length;
    if (Math.hypot(x - c[n - 2], y - c[n - 1]) < 1.5) return;
    padCtx.beginPath(); padCtx.moveTo(c[n - 2], c[n - 1]); padCtx.lineTo(x, y); padCtx.stroke();
    c.push(x, y);
  });
});
const padUp = e => { if (e.pointerId === Sign.pid) { Sign.pid = null; Sign.cur = null; } };
["pointerup", "pointercancel", "lostpointercapture"].forEach(n => padEl.addEventListener(n, padUp));
["touchstart", "touchmove"].forEach(n => padEl.addEventListener(n, e => e.preventDefault(), { passive: false }));
$("#signClear").addEventListener("click", () => { Sign.strokes = []; Sign.pid = null; Sign.cur = null; sizePad(); padInk(); });
$("#signCancel").addEventListener("click", () => Sign.done && Sign.done(null));
$("#signDone").addEventListener("click", () => { if (Sign.done && Sign.strokes.length) Sign.done(finishSignature()); });
window.addEventListener("resize", () => { if (Sign.open) sizePad(); });

/* ============================ Student flows ============================ */
function minsLateFor(per, at, date) { const p = period(per); if (!p || !p.start) return null; const d = Math.round((at - tsAt(date, p.start)) / 60000); return d > 0 ? d : null; }

async function headOut(name, per) {
  let sig = null;
  if (S.settings.sign) { sig = await getSignature(name, "Sign to head out"); if (!sig) return; }
  S.queue.items = queue().filter(x => !(x.period === per && x.name === name)); saveQueue();
  addEvent({ id: uid(), type: "pass", date: UI.day, period: per, name, sig, img: null, outAt: Date.now(), inAt: null });
  render(); toast(`${name} is signed out. The clock is running.`);
}
function joinLine(name, per) {
  queue().push({ id: uid(), period: per, name, at: Date.now() }); saveQueue();
  render(); toast(`${name} is #${queue().length} in line.`);
}
function markBack(id) {
  const p = S.events.find(e => e.id === id); if (!p || p.inAt) return;
  p.inAt = Date.now(); DB.put(p); render();
  const q = queue();
  toast(q.length && !openPasses().length ? `Welcome back. ${q[0].name} is up next.` : "Welcome back.");
}
function holdSheet(name, per, title, text) {
  openSheet(`<div class="big-name">${esc(name)}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts">` +
    (S.settings.queue ? `<button class="btn big primary" data-sa="join">Join the line</button>` : "") +
    `<button class="btn" data-sa="over">Teacher override</button><button class="btn quiet" data-sa="x">Cancel</button></div>`, {
    join() { closeSheet(); joinLine(name, per); },
    async over() { if (await askPin()) headOut(name, per); },
    x: closeSheet
  });
}
function bathFlow(name, per) {
  const open = openPasses(), mine = open.find(p => p.period === per && p.name === name);
  if (mine) return openSheet(`<div class="big-name">${esc(name)}</div><h3>Back from the bathroom?</h3><p>You've been out ${elapsed(Date.now() - mine.outAt)}.</p><div class="acts"><button class="btn big primary" data-sa="y">I'm back</button><button class="btn quiet" data-sa="x">Cancel</button></div>`,
    { y() { closeSheet(); markBack(mine.id); }, x: closeSheet });
  const q = queue(), qi = q.findIndex(x => x.period === per && x.name === name), blocked = S.settings.oneOut && open.length > 0;
  if (qi >= 0) {
    if (qi === 0 && !blocked) return headOut(name, per);
    return openSheet(`<div class="big-name">${esc(name)}</div><h3>You're #${qi + 1} in line</h3><p>${blocked ? "Wait for the pass to come back." : "Someone is ahead of you."}</p><div class="acts"><button class="btn big" data-sa="x">OK</button><button class="btn danger" data-sa="leave">Leave the line</button></div>`,
      { x: closeSheet, leave() { closeSheet(); S.queue.items = q.filter(x => x.id !== q[qi].id); saveQueue(); render(); toast("Left the line."); } });
  }
  if (blocked) return holdSheet(name, per, "The pass is out", `${who(open[0])} has been out ${mins(Date.now() - open[0].outAt) || "under 1"} min. One student at a time.`);
  if (S.settings.queue && q.length) return holdSheet(name, per, "There's a line", `${plural(q.length, "student")} waiting. ${q[0].name} is next.`);
  headOut(name, per);
}
async function lateFlow(name, per) {
  const had = todays("late").find(e => e.period === per && e.name === name);
  if (had) return toast(`${name} already signed in at ${fmtTime(had.at)}.`);
  let sig = null;
  if (S.settings.sign) { sig = await getSignature(name, "Sign in late"); if (!sig) return; }
  const at = Date.now(), ml = minsLateFor(per, at, UI.day);
  addEvent({ id: uid(), type: "late", date: UI.day, period: per, name, sig, img: null, at, minsLate: ml });
  render(); toast(`${name} signed in at ${fmtTime(at)}${ml ? ` · ${ml} min late` : ""}.`);
}

function rangeStart() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (T.range === "week") { d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dateKey(d); }
  if (T.range === "month") { d.setDate(1); return dateKey(d); }
  return "0000-00-00";
}
function studentStats() {
  const from = rangeStart(), map = new Map();
  S.events.forEach(e => {
    if (e.date < from || !e.name || (T.per !== "all" && e.period !== T.per)) return;
    const k = e.period + "|" + e.name;
    let r = map.get(k); if (!r) { r = { name: e.name, period: e.period, passes: 0, minutes: 0, longest: 0, lates: 0, lateMin: 0 }; map.set(k, r); }
    if (e.type === "pass") { r.passes++; if (e.inAt && !e.auto) { const m = mins(e.inAt - e.outAt); r.minutes += m; r.longest = Math.max(r.longest, m); } }
    else { r.lates++; r.lateMin += e.minsLate || 0; }

  rows.sort((a, b) => s === "name" ? a.name.localeCompare(b.name) : s === "period" ? a.period.localeCompare(b.period, undefined, { numeric: true }) || a.name.localeCompare(b.name) : (b[s] - a[s]) || a.name.localeCompare(b.name));

}

function entrySheet(ev) {
  const bath = T.log === "bath", isNew = !ev;

  const names = id => rosterFor(id).map(n => `<option value="${esc(n)}">`).join("");
  openSheet(`<h3>${isNew ? "Add" : "Edit"} ${bath ? "bathroom pass" : "late sign-in"}</h3><p>${esc(fmtDay(T.date))}</p>
    <label class="field">Period<select id="fPer">${perOpts(per)}${ev && !period(ev.period) ? `<option selected value="${esc(ev.period)}">Period ${esc(ev.period)}</option>` : ""}</select></label>
    <label class="field">Student<input id="fName" type="text" list="fNames" autocomplete="off" maxlength="60" value="${esc(ev ? ev.name : "")}"></label><datalist id="fNames">${names(per)}</datalist>
    ${bath ? `<div class="two"><label class="field">Time out<input id="fA" type="time" value="${ev ? hhmm(ev.outAt) : hhmm(Date.now())}"></label><label class="field">Time back<input id="fB" type="time" value="${ev && ev.inAt ? hhmm(ev.inAt) : ""}"></label></div>`
      : `<label class="field">Signed in at<input id="fA" type="time" value="${ev ? hhmm(ev.at) : hhmm(Date.now())}"></label>`}
    <div class="err" id="fErr"></div><div class="acts"><button class="btn big primary" data-sa="save">Save</button><button class="btn quiet" data-sa="x">Cancel</button></div>`, {
    save() {
      const name = $("#fName").value.trim().replace(/\s+/g, " "), p = $("#fPer").value, a = $("#fA").value, err = m => { $("#fErr").textContent = m; };
      if (!name) return err("Type the student's name.");
      if (!a) return err("Pick a time.");
      const e = ev || { id: uid(), type: bath ? "pass" : "late", date: T.date, sig: null, img: null };
      if (bath) {
        const b = $("#fB").value, outAt = tsAt(T.date, a), inAt = b ? tsAt(T.date, b) : null;
        if (inAt && inAt <= outAt) return err("Time back must be after time out.");
        if (!inAt && T.date !== todayKey()) return err("Add a time back for a past day.");
        Object.assign(e, { name, period: p, outAt, inAt }); delete e.auto;
      } else {
        const at = tsAt(T.date, a);
        Object.assign(e, { name, period: p, at, minsLate: minsLateFor(p, at, T.date) });
      }
      if (isNew) S.events.push(e);
      DB.put(e); closeSheet(); renderTeacher(); toast("Saved.");
    },
    x: closeSheet
  });
  $("#fPer").addEventListener("change", e => { $("#fNames").innerHTML = names(e.target.value); });
}

  }
  const ns = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"', pk = "http://schemas.openxmlformats.org/package/2006/relationships", od = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  files.push({ name: "[Content_Types].xml", data: utf8(X + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>${s.anchors.length ? `<Override PartName="/xl/drawings/drawing${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>` : ""}`).join("")}</Types>`) });
  files.push({ name: "_rels/.rels", data: utf8(X + `<Relationships xmlns="${pk}"><Relationship Id="rId1" Type="${od}/officeDocument" Target="xl/workbook.xml"/></Relationships>`) });
  files.push({ name: "xl/workbook.xml", data: utf8(X + `<workbook ${ns}><sheets>${sheets.map((s, i) => `<sheet name="${esc(("Period " + s.id).replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`) });
  files.push({ name: "xl/_rels/workbook.xml.rels", data: utf8(X + `<Relationships xmlns="${pk}">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${od}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length + 1}" Type="${od}/styles" Target="styles.xml"/></Relationships>`) });
  files.push({ name: "xl/styles.xml", data: utf8(X + `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE2F1EB"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" horizontal="left"/></xf></cellXfs></styleSheet>`) });
  sheets.forEach((s, i) => {
    files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: utf8(X + `<worksheet ${ns}><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${s.rows}</sheetData>${s.anchors.length ? '<drawing r:id="rId1"/>' : ""}</worksheet>`) });
    if (s.anchors.length) {
      files.push({ name: `xl/worksheets/_rels/sheet${i + 1}.xml.rels`, data: utf8(X + `<Relationships xmlns="${pk}"><Relationship Id="rId1" Type="${od}/drawing" Target="../drawings/drawing${i + 1}.xml"/></Relationships>`) });
      files.push({ name: `xl/drawings/drawing${i + 1}.xml`, data: utf8(X + `<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${od}">${s.anchors.join("")}</xdr:wsDr>`) });
      files.push({ name: `xl/drawings/_rels/drawing${i + 1}.xml.rels`, data: utf8(X + `<Relationships xmlns="${pk}">${s.rels.join("")}</Relationships>`) });
    }
  });
  media.forEach((m, i) => files.push({ name: `xl/media/image${i + 1}.png`, data: m }));
  return zip(files);
}
async function exportXlsx(scope) {
  const list = exportSet(scope), bath = T.log === "bath";
  if (!list.length) return toast(`Nothing to export for this ${scope}.`);
  toast("Building the Excel file…");
  try { download(await buildXlsx(list, bath, scope === "month"), `${bath ? "bathroom" : "late"}-log-${scope === "day" ? T.date : T.date.slice(0, 7)}.xlsx`); }
  catch (e) { toast("Couldn't build the Excel file. Try the CSV instead."); }
}

/* ----- Backup / restore ----- */
function doBackup() {
  const data = { app: "classroom-log", version: 1, exportedAt: new Date().toISOString(), settings: S.settings, roster: S.roster, events: S.events };
  download(new Blob([JSON.stringify(data)], { type: "application/json" }), `classroom-log-backup-${todayKey()}.json`);
  S.lastBackup = Date.now(); DB.setMeta("lastBackup", S.lastBackup); renderTeacher();
}
async function doRestore(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
  if (!d || d.app !== "classroom-log" || !Array.isArray(d.events) || !d.settings) return toast("That file isn't a Classroom Log backup.");
  if (!(await confirmSheet("Restore this backup?", `This replaces everything on this device with the backup from ${new Date(d.exportedAt).toLocaleDateString()} (${d.events.length} entries).`, "Replace everything", true))) return;
  S.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d.settings); S.roster = d.roster || {}; S.events = d.events.filter(e => e && e.id && e.type && e.date);
  await DB.clear(); await DB.putMany(S.events); await saveSettings(); await saveRoster();
  renderTeacher(); toast("Backup restored.");
}

/* ============================ Events ============================ */
const ACT = {
  tab(b) { UI.tab = b.dataset.v; render(); },
  period(b) { UI.manual = b.dataset.v === autoPeriod() ? null : b.dataset.v; render(); },
  name(b) { tapName(b.dataset.v); },
  other: otherName,
  back(b) { markBack(b.dataset.v); },
  qgo(b) { const x = queue().find(q => q.id === b.dataset.v); if (x) headOut(x.name, x.period); },
  qleave(b) { const x = queue().find(q => q.id === b.dataset.v); if (!x) return; confirmSheet(`Take ${x.name} out of the line?`, "They can join again any time.", "Leave the line").then(ok => { if (ok) { S.queue.items = queue().filter(q => q.id !== x.id); saveQueue(); render(); } }); },
  teacher: openTeacher,
  lockTeacher: closeTeacher,
  ttab(b) { T.tab = b.dataset.v; renderTeacher(); },
  tlog(b) { T.log = b.dataset.v; renderTeacher(); },
  day(b) { const n = Number(b.dataset.v); const k = n === 0 ? todayKey() : shiftKey(T.date, n); if (k <= todayKey()) { T.date = k; renderTeacher(); } },
  add() { entrySheet(null); },
  edit(b) { const e = S.events.find(e => e.id === b.dataset.v); if (e) entrySheet(e); },
  async del(b) { const e = S.events.find(e => e.id === b.dataset.v); if (e && await confirmSheet("Delete this entry?", `${who(e)}, Period ${e.period}. This can't be undone.`, "Delete", true)) { removeEvent(e.id); renderTeacher(); } },
  async clearDay() { const type = T.log === "bath" ? "pass" : "late", ids = S.events.filter(e => e.type === type && e.date === T.date).map(e => e.id); if (ids.length && await confirmSheet("Clear this day?", `Deletes ${plural(ids.length, "entry").replace("entrys", "entries")} for ${fmtDay(T.date)}. This can't be undone.`, "Clear the day", true)) { S.events = S.events.filter(e => !ids.includes(e.id)); await DB.delMany(ids); renderTeacher(); } },
  xlsx(b) { exportXlsx(b.dataset.v); },
  csv: exportCsv,
  statsCsv: exportStats,
  sort(b) { T.sort = b.dataset.v; renderTeacher(); },
  rper(b) { T.rosterPer = b.dataset.v; renderTeacher(); },
  perAdd() { const v = $("#newPer").value.trim(); if (!v) return; if (period(v)) return toast("That period already exists."); S.settings.periods.push({ id: v, start: "", end: "" }); saveSettings(); renderTeacher(); },
  async perDel(b) { const id = b.dataset.v; if (await confirmSheet(`Remove Period ${id}?`, "Its roster is removed. Past log entries are kept.", "Remove", true)) { S.settings.periods = S.settings.periods.filter(p => p.id !== id); delete S.roster[id]; if (UI.manual === id) UI.manual = null; saveSettings(); saveRoster(); renderTeacher(); } },
  async changePin() { const old = S.pin; S.pin = null; if (!(await createPin())) S.pin = old; },
  backup: doBackup,
  restore() { $("#restoreFile").click(); },
  async wipe() { if (await confirmSheet("Erase all log entries?", "Download a backup first if you want to keep this term's records. Rosters and settings stay.", "Erase logs", true)) { S.events = []; S.queue.items = []; await DB.clear(); saveQueue(); renderTeacher(); toast("Logs erased."); } }
};
document.addEventListener("click", e => { UI.touched = Date.now(); if (modal.contains(e.target)) return; const b = e.target.closest("[data-act]"); if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b); });
document.addEventListener("pointerdown", () => { UI.touched = Date.now(); }, true);
document.addEventListener("keydown", () => { UI.touched = Date.now(); }, true);

$("#tBody").addEventListener("change", e => {
  const t = e.target;
  if (t.id === "tDate") { if (t.value && t.value <= todayKey()) T.date = t.value; renderTeacher(); }
  else if (t.id === "sRange") { T.range = t.value; renderTeacher(); }
  else if (t.id === "sPer") { T.per = t.value; renderTeacher(); }
  else if (t.id === "overMin") { S.settings.overMin = Number(t.value); saveSettings(); }
  else if (t.dataset.set) { S.settings[t.dataset.set] = t.checked; saveSettings(); }
  else if (t.dataset.sched) {
    const p = period(t.dataset.v); p[t.dataset.sched] = t.value;
    if (p.start && p.end && p.end <= p.start) toast(`Period ${p.id} ends before it starts.`);
    saveSettings();
  }
  else if (t.id === "restoreFile" && t.files[0]) { doRestore(t.files[0]); t.value = ""; }
});
$("#tBody").addEventListener("input", e => {
  const t = e.target;
  if (t.id === "rText") {
    const seen = new Set(), names = t.value.split("\n").map(s => s.trim().replace(/\s+/g, " ")).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));
    S.roster[T.rosterPer] = names; saveRoster();
    $("#rCount").textContent = `${plural(names.length, "student")} · saved`;
  } else if (t.dataset.text) { S.settings[t.dataset.text] = t.value; saveSettings(); }
});

/* ============================ Clock ============================ */
setInterval(() => {
  const tk = todayKey(), auto = autoPeriod(); let redraw = false;
  if (tk !== UI.day) { UI.day = tk; UI.manual = null; redraw = true; }                 /* new day: roll over on its own */
  if (auto !== UI.lastAuto) { UI.lastAuto = auto; if (auto) UI.manual = null; redraw = true; } /* bell rang */
  if (autoClose()) redraw = true;
  const idle = Date.now() - UI.touched;
  if (idle > 60000 && !T.open) { if (Sign.done) Sign.done(null); if (modal.classList.contains("show")) dismissSheet(); }
  if (idle > 300000 && T.open) { if (Sign.done) Sign.done(null); closeTeacher(); redraw = false; }
  if (redraw && !T.open) render(); else tickTimers();
}, 1000);

/* ============================ Start ============================ */
(async () => {
  await DB.open();
  if (DB.ok) {
    const [st, ro, qu, pin, lb, ev] = await Promise.all([DB.getMeta("settings"), DB.getMeta("roster"), DB.getMeta("queue"), DB.getMeta("pin"), DB.getMeta("lastBackup"), DB.all()]);
    if (st) S.settings = Object.assign(S.settings, st);
    if (ro) S.roster = ro;
    if (qu && qu.date === todayKey()) S.queue = qu;
    S.pin = pin || null; S.lastBackup = lb || null; S.events = ev || [];
    await migrateOld();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } else banner("This browser isn't letting the site save (private browsing?). Entries will be lost when the page closes.");
  if (location.hash === "#reset-pin") { S.pin = null; await DB.delMeta("pin"); history.replaceState(null, "", location.pathname); toast("PIN cleared. Tap Teacher to set a new one."); }
  UI.lastAuto = autoPeriod();
  autoClose(); render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
